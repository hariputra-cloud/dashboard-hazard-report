    const isExcludedAirport = (airportName) => {
        if (!airportName) return true;
        const clean = airportName.toString().trim().toLowerCase();
        if (!clean || clean === "-" || clean === "null" || clean === "undefined" || clean === "tanpa nama" || clean === "n/a" || clean === "unnamed") return true;
        if (clean.includes("hang nadim") || clean.includes("kualanamu") || clean.includes("kuala namu")) return true;
        return false;
    };

    const classifyHazard = (desc) => {
        if (!desc) return "Hazard Operasional lainnya";
        const text = desc.toString().toLowerCase();
        
        if (/(sanitasi|air kotor|wc mampet|pesing|kotoran|saluran mampet)/.test(text)) return "Sanitasi";
        if (/(drainase|parit|genangan|saluran air|banjir|gorong-gorong)/.test(text)) return "Drainase Sisi Udara";
        if (/(baut|kerikil|batu|kawat|plastik|benda asing|fod|serpihan)/.test(text)) return "FOD (Foreign Object Debris)";
        if (/(burung|bird|baza|kuntul|cangak)/.test(text)) return "Bird Strike";
        if (/(anjing|kucing|ular|monyet|babi|biawak|hewan liar|wildlife)/.test(text)) return "Wildlife Hazard";
        if (/(afl|papi|runway light|taxiway light|apron light|sirkit|lampu landasan|constant current regulator)/.test(text)) return "Airfield Lighting";
        if (/(kabel|konslet|listrik|panel|mcb|trafo|genset|stop kontak|saklar)/.test(text)) return "Kelistrikan Bangunan";
        if (/(atap|plafon|dinding|lantai|kaca|bocor|retak|struktur bangunan)/.test(text)) return "Struktur Bangunan";
        if (/(aspal|beton|pavement|lubang|taxiway retak|apron amblas)/.test(text)) return "Struktur Permukaan";
        if (/(marka|cat memudar|garis|tulisan terkelupas)/.test(text)) return "Marka Runway/Taxiway/Apron";
        if (/(gse|baggage cart|towing|aft|btt|loader)/.test(text)) return "Peralatan GSE";
        if (/(sop|kelelahan|human factor|kelalaian|tidak menggunakan apd|pelanggaran)/.test(text)) return "Human Factor";
        if (/(rumput|ilalang|gulma|vegetasi|pohon)/.test(text)) return "Rumput & Vegetasi Liar";

        return "Hazard Operasional lainnya";
    };

    const getCalculatedRisk = (category, desc) => {
        const text = (desc || "").toLowerCase();
        if (/(runway|papi|baut|konslet|trafo|pothole|amblas|burung)/.test(text) || 
            category === "Bird Strike" || category === "Airfield Lighting" || category === "FOD (Foreign Object Debris)") {
            return "Tinggi";
        }
        if (category === "Sanitasi" || category === "Rumput & Vegetasi Liar") {
            return "Rendah";
        }
        return "Sedang";
    };

    const DownloadImageBtn = ({ targetId, filename, label = "Gambar PNG" }) => {
        const [downloading, setDownloading] = useState(false);

        const handleDownload = (e) => {
            e.stopPropagation();
            const elem = document.getElementById(targetId);
            if (!elem) return;
            setDownloading(true);

            const h2c = window.html2canvas;
            if (!h2c) {
                console.error("Library Canvas belum siap.");
                setDownloading(false);
                return;
            }

            h2c(elem, {
                scale: 3,
                backgroundColor: '#0f172a',
                useCORS: true,
                logging: false,
                onclone: (clonedDoc) => {
                    const clonedElem = clonedDoc.getElementById(targetId);
                    if (clonedElem) {
                        const btns = clonedElem.querySelectorAll('.no-export-btn');
                        btns.forEach(b => b.style.display = 'none');
                        clonedElem.style.padding = '20px';
                        clonedElem.style.borderRadius = '16px';
                        clonedElem.style.boxShadow = '0 10px 25px -5px rgba(0, 0, 0, 0.5)';
                    }
                }
            }).then(canvas => {
                const imageUrl = canvas.toDataURL('image/png', 1.0);
                const link = document.createElement('a');
                link.download = `${filename}_${new Date().toISOString().slice(0,10)}.png`;
                link.href = imageUrl;
                link.click();
                setDownloading(false);
            }).catch(err => {
                console.error("Export error:", err);
                setDownloading(false);
            });
        };

        return (
            <button 
                onClick={handleDownload}
                disabled={downloading}
                className="no-export-btn text-[11px] font-medium px-2.5 py-1 rounded-lg bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 transition-all flex items-center gap-1.5 shrink-0 hover:scale-105 active:scale-95 cursor-pointer"
                title="Download gambar High Resolution (300 DPI) untuk Word & PowerPoint"
            >
                <i className={`fas ${downloading ? 'fa-spinner fa-spin text-amber-400' : 'fa-download text-sky-400'}`}></i>
                <span>{downloading ? 'Proses...' : label}</span>
            </button>
        );
    };

    const DigitalClock = ({ currentTime }) => {
        const formatTwoDigits = (num) => String(num).padStart(2, '0');
        
        const hours = formatTwoDigits(currentTime.getHours());
        const minutes = formatTwoDigits(currentTime.getMinutes());
        const seconds = formatTwoDigits(currentTime.getSeconds());
        
        const utcHours = formatTwoDigits(currentTime.getUTCHours());
        const utcMinutes = formatTwoDigits(currentTime.getUTCMinutes());
        const utcSeconds = formatTwoDigits(currentTime.getUTCSeconds());

        const daysIndo = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const monthsIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        
        const dayName = daysIndo[currentTime.getDay()];
        const dayDate = currentTime.getDate();
        const monthName = monthsIndo[currentTime.getMonth()];
        const year = currentTime.getFullYear();

        return (
            <div className="flex items-center gap-3 bg-navy-950/90 border border-sky-500/40 backdrop-blur-md px-4 py-2 rounded-2xl shadow-[0_0_20px_rgba(56,189,248,0.2)] relative overflow-hidden group">
                <div className="absolute -inset-x-full top-0 h-[1px] bg-gradient-to-r from-transparent via-sky-400 to-transparent group-hover:animate-pulse"></div>
                
                <div className="relative flex items-center justify-center w-10 h-10 rounded-xl bg-sky-500/10 border border-sky-500/30 text-sky-400 shrink-0">
                    <i className="fas fa-clock text-lg animate-pulse"></i>
                    <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 rounded-full animate-ping opacity-75"></span>
                    <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 rounded-full"></span>
                </div>

                <div className="flex flex-col justify-center">
                    <div className="flex items-baseline gap-2">
                        <div className="font-mono text-xl sm:text-2xl font-black tracking-widest text-sky-300 drop-shadow-[0_0_8px_rgba(56,189,248,0.6)] flex items-center">
                            <span>{hours}</span>
                            <span className="animate-pulse mx-0.5 text-sky-400">:</span>
                            <span>{minutes}</span>
                            <span className="animate-pulse mx-0.5 text-sky-400">:</span>
                            <span className="text-sky-400/90 text-lg sm:text-xl">{seconds}</span>
                        </div>

                        <span className="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/40 tracking-wider uppercase font-mono">
                            WIB
                        </span>

                        <div className="hidden xl:flex items-center gap-1.5 pl-2 border-l border-slate-700/80 text-[11px] font-mono">
                            <i className="fas fa-plane-departure text-[10px] text-amber-400"></i>
                            <span className="text-amber-300 font-bold">{utcHours}:{utcMinutes}:{utcSeconds}</span>
                            <span className="text-[9px] text-amber-400/80 font-extrabold">ZULU (UTC)</span>
                        </div>
                    </div>

                    <div className="flex items-center gap-2 text-[11px] text-slate-300 font-medium">
                        <span className="text-sky-400 font-bold uppercase tracking-wider text-[10px]">{dayName},</span>
                        <span className="text-slate-200 font-semibold">{dayDate} {monthName} {year}</span>
                    </div>
                </div>
            </div>
        );
    };

        const [filterMonth, setFilterMonth] = useState("ALL");

        const [currentPage, setCurrentPage] = useState(1);
        const itemsPerPage = 10;

        const [isDataLoaded, setIsDataLoaded] = useState(true);
        const [isExportingPDF, setIsExportingPDF] = useState(false);
        const [sidebarOpen, setSidebarOpen] = useState(true);

        const [sortConfig, setSortConfig] = useState({ key: 'total', direction: 'desc' });
        const [modalConfig, setModalConfig] = useState({ isOpen: false, airport: null, type: null, data: [] });
        const [detailModalItem, setDetailModalItem] = useState(null);

        const dashboardRef = useRef(null);

        useEffect(() => {
            const timer = setInterval(() => setCurrentTime(new Date()), 1000);
            
            const prepared = HARDCODED_DATASET
                .filter(item => !isExcludedAirport(item.airport))
                .map(item => {
                    const dateObj = new Date(item.dateStr);
                    const month = dateObj.toLocaleString('id-ID', { month: 'short', year: 'numeric' });
                    const monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
                    return {
                        ...item,
                        dateObj,
                        month,
                        monthKey
                    };
                });
            
            setData(prepared);
            setIsDataLoaded(true);

            return () => clearInterval(timer);
        }, []);

        const handleExportPDF = () => {
            if (!dashboardRef.current) return;
            
            setIsExportingPDF(true);
            document.body.classList.add('export-mode');

            setTimeout(() => {
                const element = dashboardRef.current;
                const opt = {
                    margin:       [6, 6, 6, 6],
                    filename:     `Hazard_Dashboard_${new Date().toISOString().slice(0,10)}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true, 
                        logging: false,
                        backgroundColor: '#020617',
                        windowWidth: 1080,
                        width: 1080,
                        scrollX: 0,
                        scrollY: 0
                    },
                    pagebreak:    { mode: ['css', 'legacy'] },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape', compress: true }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    setIsExportingPDF(false);
                    document.body.classList.remove('export-mode');
                }).catch(err => {
                    console.error("Error generating PDF:", err);
                    setIsExportingPDF(false);
                    document.body.classList.remove('export-mode');
                });
            }, 1000);
        };

        const handleExportCSV = () => {
            if (!filteredData.length) return;
            const exportRows = filteredData.map(d => ({
                "Tanggal": d.dateObj ? d.dateObj.toLocaleDateString('id-ID') : '',
                "Bandara": d.airport,
                "Kategori": d.category,
                "Uraian Hazard": d.desc,
                "Lokasi Detail": d.location,
                "Risk Rating": d.risk,
                "Status": d.status
            }));

            const csvString = Papa.unparse(exportRows);
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Hazard_Report_Export_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const parseCSV = (file) => {
            setLoading(true);
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    const rawData = results.data;
                    if (rawData.length === 0) {
                        setLoading(false);
                        return;
                    }

                    const headers = Object.keys(rawData[0]).map(h => h.trim().toLowerCase());
                    
                    const findCol = (keywords) => {
                        for(let k of keywords) {
                            const exact = headers.find(h => h === k);
                            if(exact) return Object.keys(rawData[0])[headers.indexOf(exact)];
                        }
                        for(let k of keywords) {
                            const partial = headers.find(h => h.includes(k));
                            if(partial) return Object.keys(rawData[0])[headers.indexOf(partial)];
                        }
                        return null;
                    };

                    const activeCols = {
                        date: findCol(['eventdate', 'event date', 'tanggal', 'date', 'waktu']) || Object.keys(rawData[0])[0],
                        airport: findCol(['airport', 'bandara', 'cabang', 'lokasi']) || Object.keys(rawData[0])[1],
                        category: findCol(['category', 'kategori']) || Object.keys(rawData[0])[2],
                        desc: findCol(['description', 'uraian', 'deskripsi', 'uraian kejadian']) || Object.keys(rawData[0])[2],
                        status: findCol(['status tindak lanjut', 'status', 'status temuan']) || Object.keys(rawData[0])[3],
                        locationDetails: findCol(['lokasi detail', 'detail lokasi', 'area', 'tempat', 'location', 'lokasi temuan']) || null,
                        risk: findCol(['risk rating', 'risk', 'tingkat risiko', 'risiko']) || null
                    };

                    const processedData = [];
                    let idCounter = 501;

                    rawData.forEach((row) => {
                        const getVal = (colKey) => {
                            const key = activeCols[colKey];
                            return key && row[key] ? row[key].toString().trim() : "";
                        };

                        const airportRaw = getVal('airport');
                        let apClean = airportRaw ? airportRaw.trim() : "";

                        if (isExcludedAirport(apClean)) return;

                        const dateRaw = getVal('date');
                        const descRaw = getVal('desc');
                        const statusRaw = getVal('status');
                        const rawLoc = activeCols['locationDetails'] ? getVal('locationDetails') : "";
                        const rawRisk = activeCols['risk'] ? getVal('risk') : "";
                        
                        let locationClean = rawLoc.trim();
                        if (!locationClean || locationClean === "-") locationClean = "Area Tidak Spesifik";

                        let dateObj;
                        const parts = (dateRaw || "").trim().split(/[-/]/);
                        if (parts.length === 3) {
                            if (parts[2].length === 4) dateObj = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                            else if (parts[0].length === 4) dateObj = new Date(`${parts[0]}-${parts[1]}-${parts[2]}`);
                            else dateObj = new Date(dateRaw);
                        } else {
                            dateObj = new Date(dateRaw);
                        }

                        if (isNaN(dateObj.getTime())) dateObj = new Date();
                        
                        const month = dateObj.toLocaleString('id-ID', { month: 'short', year: 'numeric' });
                        const monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;

                        let statusClean = 'PROSES';
                        const s = (statusRaw || "").toUpperCase();
                        if (s.includes('CLOSE') || s.includes('SELESAI') || s.includes('CLASSIFIED')) {
                            statusClean = 'SELESAI';
                        }

                        const categoryClean = classifyHazard(descRaw);
                        const riskLevel = rawRisk || getCalculatedRisk(categoryClean, descRaw);

                        processedData.push({
                            id: `HZD-${idCounter++}`,
                            dateObj,
                            month,
                            monthKey,
                            airport: apClean,
                            category: categoryClean,
                            status: statusClean,
                            desc: descRaw,
                            location: locationClean,
                            risk: riskLevel
                        });
                    });
                    
                    setData(processedData);
                    setIsDataLoaded(true);
                    setLoading(false);
                },
                error: (err) => {
                    console.error("Error parsing CSV:", err);
                    setLoading(false);
                }
            });
        };

        const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                setFileName(file.name);
                parseCSV(file);
            }
        };

        const filteredData = useMemo(() => {
            let temp = [...data];

            if (searchTerm.trim()) {
                const query = searchTerm.toLowerCase();
                temp = temp.filter(d => 
                    d.desc.toLowerCase().includes(query) ||
                    d.airport.toLowerCase().includes(query) ||
                    d.category.toLowerCase().includes(query) ||
                    d.location.toLowerCase().includes(query)
                );
            }

            if (filterStart) {
                const start = new Date(filterStart);
                temp = temp.filter(d => d.dateObj >= start);
            }
            if (filterEnd) {
                const end = new Date(filterEnd);
                temp = temp.filter(d => d.dateObj <= end);
            }
            if (filterMonth !== "ALL") {
                temp = temp.filter(d => d.month === filterMonth);
            }
            if (filterAirport !== "ALL") {
                temp = temp.filter(d => d.airport === filterAirport);
            }
            if (filterCategory !== "ALL") {
                temp = temp.filter(d => d.category === filterCategory);
            }
            if (filterStatus !== "ALL") {
                temp = temp.filter(d => d.status === filterStatus);
            }
            if (filterRisk !== "ALL") {
                temp = temp.filter(d => d.risk === filterRisk);
            }

            return temp;
        }, [data, searchTerm, filterStart, filterEnd, filterAirport, filterCategory, filterStatus, filterRisk, filterMonth]);

        const stats = useMemo(() => {
            const total = filteredData.length;
            const selesai = filteredData.filter(d => d.status === 'SELESAI').length;
            const proses = total - selesai;
            const compRate = total > 0 ? ((selesai / total) * 100).toFixed(1) : 0;
            const highRiskCount = filteredData.filter(d => d.risk === 'Tinggi').length;
            return { total, selesai, proses, compRate, highRiskCount };
        }, [filteredData]);

        const topHazards = useMemo(() => {
            const counts = {};
            const totalItems = filteredData.length;
            
            filteredData.forEach(d => counts[d.category] = (counts[d.category] || 0) + 1);
            
            return Object.entries(counts)
                .map(([name, count]) => ({
                    name, 
                    shortName: name.length > 22 ? name.substring(0, 19) + '...' : name,
                    count, 
                    percentage: totalItems > 0 ? ((count / totalItems) * 100).toFixed(1) : 0,
                    displayLabel: `${count} (${totalItems > 0 ? ((count / totalItems) * 100).toFixed(1) : 0}%)`
                }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 8);
        }, [filteredData]);

        const topLocations = useMemo(() => {
            const counts = {};
            const totalItems = filteredData.length;
            
            filteredData.forEach(d => {
                let loc = d.location || "Area Tidak Spesifik";
                counts[loc] = (counts[loc] || 0) + 1;
            });
            return Object.entries(counts)
                .map(([name, count]) => ({
                    name, 
                    shortName: name.length > 20 ? name.substring(0, 17) + '...' : name,
                    count,
                    percentage: totalItems > 0 ? ((count / totalItems) * 100).toFixed(1) : 0,
                    displayLabel: `${count} (${totalItems > 0 ? ((count / totalItems) * 100).toFixed(1) : 0}%)`
                }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 8);
        }, [filteredData]);

        const trendData = useMemo(() => {
            const counts = {};
            filteredData.forEach(d => {
                if (!counts[d.month]) {
                    counts[d.month] = { name: d.month, count: 0, sortKey: d.monthKey, selesai: 0, proses: 0 };
                }
                counts[d.month].count += 1;
                if (d.status === 'SELESAI') counts[d.month].selesai += 1;
                else counts[d.month].proses += 1;
            });
            return Object.values(counts).sort((a, b) => a.sortKey.localeCompare(b.sortKey));
        }, [filteredData]);

        const statusPieData = useMemo(() => [
            { name: 'Selesai', value: stats.selesai, color: '#34d399' },
            { name: 'Dalam Proses', value: stats.proses, color: '#fbbf24' }
        ], [stats]);

        const dailyTrendData = useMemo(() => {
            const counts = {};
            filteredData.forEach(d => {
                if (!d.dateObj) return;
                const dateKey = d.dateObj.toISOString().slice(0, 10);
                const displayDate = d.dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' });
                
                if (!counts[dateKey]) {
                    counts[dateKey] = { 
                        name: displayDate, 
                        dateStr: dateKey,
                        count: 0, 
                        selesai: 0, 
                        proses: 0,
                        dateObj: d.dateObj
                    };
                }
                counts[dateKey].count += 1;
                if (d.status === 'SELESAI') counts[dateKey].selesai += 1;
                else counts[dateKey].proses += 1;
            });

            return Object.values(counts).sort((a, b) => a.dateObj - b.dateObj);
        }, [filteredData]);

        const riskPieData = useMemo(() => {
            const counts = { 'Tinggi': 0, 'Sedang': 0, 'Rendah': 0 };
            filteredData.forEach(d => counts[d.risk] = (counts[d.risk] || 0) + 1);
            return [
                { name: 'Tinggi', value: counts['Tinggi'], color: '#fb7185' },
                { name: 'Sedang', value: counts['Sedang'], color: '#fbbf24' },
                { name: 'Rendah', value: counts['Rendah'], color: '#34d399' }
            ].filter(item => item.value > 0);
        }, [filteredData]);

        const airportData = useMemo(() => {
            const map = {};
            filteredData.forEach(d => {
                if(!map[d.airport]) map[d.airport] = { name: d.airport, total: 0, selesai: 0 };
                map[d.airport].total += 1;
                if(d.status === 'SELESAI') map[d.airport].selesai += 1;
            });
            
            let result = Object.values(map).map(a => {
                const rate = a.total > 0 ? (a.selesai / a.total) * 100 : 0;
                return { ...a, proses: a.total - a.selesai, compRate: rate, compRateStr: rate.toFixed(1) + '%' };
            });

            if (filterCompRate === "<50") result = result.filter(a => a.compRate < 50);
            if (filterCompRate === "50-80") result = result.filter(a => a.compRate >= 50 && a.compRate <= 80);
            if (filterCompRate === ">80") result = result.filter(a => a.compRate > 80);

            return result; 
        }, [filteredData, filterCompRate]);

        const sortedAirportData = useMemo(() => {
            let result = [...airportData];
            result.sort((a, b) => {
                if (sortConfig.key === 'name') {
                    return sortConfig.direction === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
                } else {
                    return sortConfig.direction === 'asc' ? a[sortConfig.key] - b[sortConfig.key] : b[sortConfig.key] - a[sortConfig.key];
                }
            });
            return result;
        }, [airportData, sortConfig]);

        const paginatedData = useMemo(() => {
            const start = (currentPage - 1) * itemsPerPage;
            return filteredData.slice(start, start + itemsPerPage);
        }, [filteredData, currentPage]);

        const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;

        const uniqueAirports = [...new Set(data.map(d => d.airport))].sort();
        const uniqueCategories = [...new Set(data.map(d => d.category))].sort();
        const monthSortMap = {};
        data.forEach(d => { monthSortMap[d.month] = d.monthKey; });
        const uniqueMonths = [...new Set(data.map(d => d.month))].sort((a, b) => (monthSortMap[a] || '').localeCompare(monthSortMap[b] || ''));

        const resetFilters = () => {
            setSearchTerm("");
            setFilterStart("");
            setFilterEnd("");
            setFilterAirport("ALL");
            setFilterCategory("ALL");
            setFilterStatus("ALL");
            setFilterRisk("ALL");
            setFilterCompRate("ALL");
            setFilterMonth("ALL");
            setCurrentPage(1);
        };

        const handleSort = (key) => {
            let direction = 'desc';
            if (sortConfig.key === key && sortConfig.direction === 'desc') direction = 'asc';
            setSortConfig({ key, direction });
        };

        const handleOpenAirportModal = (airport, type) => {
            let details = filteredData.filter(d => d.airport === airport);
            if (type === 'selesai') details = details.filter(d => d.status === 'SELESAI');
            if (type === 'proses') details = details.filter(d => d.status !== 'SELESAI');
            details.sort((a, b) => a.category.localeCompare(b.category));
            setModalConfig({ isOpen: true, airport, type, data: details });
        };

        const renderCustomPieLabel = ({ cx, cy, midAngle, innerRadius, outerRadius, value }) => {
            if (!value) return null;
            const RADIAN = Math.PI / 180;
            const radius = innerRadius + (outerRadius - innerRadius) * 0.5;
            const x = cx + radius * Math.cos(-midAngle * RADIAN);
            const y = cy + radius * Math.sin(-midAngle * RADIAN);
            return (
                <text x={x} y={y} fill="#ffffff" textAnchor="middle" dominantBaseline="central" fontSize="11" fontWeight="bold">
                    {value}
                </text>
            );
        };

        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const dataItem = payload[0].payload;
                return (
                    <div className="bg-slate-800 border border-slate-600 p-3 rounded-lg shadow-xl text-xs z-50">
                        <p className="text-slate-200 font-semibold mb-1">{dataItem.name || label}</p>
                        {payload.map((entry, idx) => (
                            <p key={idx} style={{ color: entry.color || entry.fill }} className="font-bold">
                                {entry.name || 'Total'}: {entry.value} {dataItem.percentage ? `(${dataItem.percentage}%)` : ''}
                            </p>
                        ))}
                    </div>
                );
            }
            return null;
        };

        return (
            <div className="flex w-full min-h-screen bg-navy-900 text-slate-100 relative overflow-hidden">
                
                {/* Sidebar Filter */}
                <aside className={`${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 transition-transform duration-300 fixed lg:relative z-40 w-80 h-full min-h-screen bg-navy-800 border-r border-slate-800 flex flex-col shadow-2xl overflow-y-auto shrink-0`}>
                    <div className="p-5 border-b border-slate-700/60">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 bg-aviation-blue/10 border border-aviation-blue/30 rounded-xl text-aviation-blue">
                                    <i className="fas fa-shield-halved text-2xl"></i>
                                </div>
                                <div>
                                    <h1 className="text-base font-extrabold text-slate-100 tracking-wider">HAZARD REPORT<span className="text-aviation-blue"> MONITORING</span></h1>
                                    <p className="text-xs text-slate-400">Airport Safety & RFF Group</p>
                                </div>
                            </div>
                            <button onClick={() => setSidebarOpen(false)} className="lg:hidden text-slate-400 hover:text-slate-200">
                                <i className="fas fa-times text-lg"></i>
                            </button>
                        </div>

                        {/* File Upload & Export Controls */}
                        <div className="space-y-2">
                            <label className="cursor-pointer bg-aviation-blue/10 hover:bg-aviation-blue/20 text-aviation-blue border border-aviation-blue/40 text-xs font-bold py-2.5 px-3 rounded-lg transition-all flex items-center justify-center gap-2 w-full">
                                <i className="fas fa-cloud-upload-alt text-sm"></i>
                                <span>Ganti Data CSV</span>
                                <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" />
                            </label>

                            <div className="grid grid-cols-2 gap-2">
                                <button 
                                    onClick={handleExportPDF}
                                    disabled={isExportingPDF || !isDataLoaded}
                                    className="text-xs font-semibold py-2 px-2 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center gap-1.5"
                                >
                                    <i className="fas fa-file-pdf"></i> Export PDF
                                </button>
                                <button 
                                    onClick={handleExportCSV}
                                    disabled={!isDataLoaded}
                                    className="text-xs font-semibold py-2 px-2 rounded-lg bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 flex items-center justify-center gap-1.5"
                                >
                                    <i className="fas fa-file-csv"></i> Export CSV
                                </button>
                            </div>
                        </div>

                        {fileName && (
                            <div className="mt-3 text-[11px] text-slate-400 flex items-center justify-between bg-navy-900/80 p-2 rounded border border-slate-800">
                                <span className="truncate flex items-center gap-1.5" title={fileName}>
                                    <i className="fas fa-file-excel text-emerald-400"></i>
                                    <span className="truncate">{fileName}</span>
                                </span>
                                <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded font-mono">LIVEMODE</span>
                            </div>
                        )}
                    </div>

                    <div className="p-5 space-y-4 flex-1 text-xs">
                        <div className="flex items-center justify-between">

                            <button onClick={resetFilters} className="text-aviation-blue hover:underline text-[11px] flex items-center gap-1">
                                <i className="fas fa-rotate-left"></i> Reset Filter
                            </button>
                        </div>

                        <div>
                            <label className="block text-slate-400 mb-1 font-semibold">Cari Keyword</label>
                            <div className="relative">
                                <i className="fas fa-search absolute left-3 top-2.5 text-slate-500"></i>
                                <input 
                                    type="text" 
                                    placeholder="Cari deskripsi, lokasi..." 
                                    value={searchTerm} 
                                    onChange={e => setSearchTerm(e.target.value)}
                                    className="w-full bg-navy-900 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-slate-200 focus:border-aviation-blue outline-none" 
                                />
                            </div>
                        </div>

                                <input type="date" value={filterEnd} onChange={e => setFilterEnd(e.target.value)} 
                                    className="w-full bg-navy-900 border border-slate-700 rounded p-1.5 text-slate-200 focus:border-aviation-blue outline-none text-[11px]" />
                            </div>
                        </div>

                        <div>
                            <label className="block text-slate-400 mb-1 font-semibold">Periode Bulan</label>
                            <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)}
                                className="w-full bg-navy-900 border border-slate-700 rounded p-1.5 text-slate-200 focus:border-aviation-blue outline-none">
                                <option value="ALL">Semua Bulan</option>
                                {uniqueMonths.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>

                        <div>
                            <label className="block text-slate-400 mb-1 font-semibold">Bandara / Cabang</label>
                            <select value={filterAirport} onChange={e => setFilterAirport(e.target.value)}
                                className="w-full bg-navy-900 border border-slate-700 rounded p-1.5 text-slate-200 focus:border-aviation-blue outline-none">
                                <option value="ALL">Semua Bandara</option>
                                {uniqueAirports.map(a => <option key={a} value={a}>{a}</option>)}
                            </select>
                        </div>

                        <div>
                            <label className="block text-slate-400 mb-1 font-semibold">Kategori Hazard</label>
                            <select value={filterCategory} onChange={e => setFilterCategory(e.target.value)}
                                className="w-full bg-navy-900 border border-slate-700 rounded p-1.5 text-slate-200 focus:border-aviation-blue outline-none">
                                <option value="ALL">Semua Kategori</option>
                                {uniqueCategories.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <label className="block text-slate-400 mb-1 font-semibold">Status</label>
                                <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}
                                    className="w-full bg-navy-900 border border-slate-700 rounded p-1.5 text-slate-200 focus:border-aviation-blue outline-none">
                                    <option value="ALL">Semua</option>
                                    <option value="SELESAI">Selesai</option>
                                    <option value="PROSES">Proses</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-slate-400 mb-1 font-semibold">Tingkat Risiko</label>
                                <select value={filterRisk} onChange={e => setFilterRisk(e.target.value)}
                                    className="w-full bg-navy-900 border border-slate-700 rounded p-1.5 text-slate-200 focus:border-aviation-blue outline-none">
                                    <option value="ALL">Semua</option>
                                    <option value="Tinggi">Tinggi</option>
                                    <option value="Sedang">Sedang</option>
                                    <option value="Rendah">Rendah</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </aside>

                {/* Main Content Area */}
                <main ref={dashboardRef} className={`${isExportingPDF ? 'w-[1080px] export-container' : 'flex-1'} flex flex-col h-screen overflow-y-auto bg-navy-900 p-4 lg:p-6`}>
                    
                    {/* Navigation Topbar */}
                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6 bg-navy-800/80 p-4 rounded-2xl border border-slate-700/60 no-export">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setSidebarOpen(!sidebarOpen)} className="lg:hidden p-2 bg-slate-800 rounded-lg text-slate-300">
                                <i className="fas fa-bars"></i>
                            </button>
                            <div>
                                <h2 className="text-xl font-bold text-slate-100 flex items-center gap-2">
                                    <span className="w-3 h-3 rounded-full bg-emerald-400 pulse-indicator"></span>

                        <div id="table-hazard-detail" className="glass-panel p-5 rounded-2xl border border-slate-700/60 shadow-xl space-y-4">
                            <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                                <div>
                                    <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">
                                        <i className="fas fa-table text-aviation-blue"></i> Detail Laporan Hazard ({filteredData.length})
                                    </h3>
                                    <p className="text-xs text-slate-400">Menampilkan Halaman {currentPage} dari {totalPages}</p>
                                </div>
                                <DownloadImageBtn targetId="table-hazard-detail" filename="Tabel_Detail_Laporan_Hazard" label="Gambar Tabel PNG" />
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs text-slate-200">
                                    <thead className="bg-slate-800/90 text-slate-400 uppercase font-semibold">
                                        <tr>
                                            <th className="p-3">ID / Tanggal</th>
                                            <th className="p-3">Bandara</th>
                                            <th className="p-3">Kategori</th>
                                            <th className="p-3">Deskripsi Hazard</th>
                                            <th className="p-3">Lokasi</th>
                                            <th className="p-3 text-center">Risiko</th>
                                            <th className="p-3 text-center">Status</th>
                                            <th className="p-3 text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {paginatedData.map((item) => (
                                            <tr key={item.id} className="hover:bg-slate-800/50 transition-colors">
                                                <td className="p-3 whitespace-nowrap">
                                                    <span className="font-mono text-slate-400 block">{item.id}</span>
                                                    <span className="font-semibold text-slate-200">{item.dateObj ? item.dateObj.toLocaleDateString('id-ID') : '-'}</span>
                                                </td>
                                                <td className="p-3 font-medium text-slate-100">{item.airport}</td>
                                                <td className="p-3 text-sky-400 font-medium">{item.category}</td>
                                                <td className="p-3 max-w-xs truncate" title={item.desc}>{item.desc}</td>
                                                <td className="p-3 text-slate-300">{item.location}</td>
                                                <td className="p-3 text-center">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                                        item.risk === 'Tinggi' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                                                        item.risk === 'Sedang' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                                        'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                                                    }`}>
                                                        {item.risk}
                                                    </span>
                                                </td>
                                                <td className="p-3 text-center">
                                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                                        item.status === 'SELESAI' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                                                        'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                                    }`}>
                                                        {item.status}
                                                    </span>
                                                </td>
                                                <td className="p-3 text-center">
                                                    <button 
                                                        onClick={() => setDetailModalItem(item)} 
                                                        className="p-1.5 bg-slate-800 hover:bg-slate-700 text-sky-400 rounded-lg transition-colors"
                                                        title="Lihat Detail Laporan"
                                                    >
                                                        <i className="fas fa-eye"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            {/* Pagination Controls */}
                            <div className="flex items-center justify-between pt-3 border-t border-slate-800">
                                <button 
                                    onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                                    disabled={currentPage === 1}
                                    className="px-3 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold"
                                >
                                    <i className="fas fa-chevron-left mr-1"></i> Sebelum
                                </button>
                                <span className="text-xs text-slate-400">
                                    Halaman {currentPage} dari {totalPages}
                                </span>
                                <button 
                                    onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                                    disabled={currentPage === totalPages}
                                    className="px-3 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold"
                                >
                                    Sesudah <i className="fas fa-chevron-right ml-1"></i>
                                </button>
                            </div>
                        </div>
                    )}

                </main>

                {}

                {detailModalItem && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">

                            {/* Futuristic Background Accents */}
                            <div className="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
                            <div className="absolute bottom-0 left-0 -ml-20 -mb-20 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-sky-400 via-emerald-400 to-amber-400 opacity-80"></div>

                            <button 
                                onClick={() => setDetailModalItem(null)} 
                                className="absolute top-5 right-5 text-slate-400 hover:text-sky-400 transition-colors bg-navy-900/50 p-2 rounded-full border border-slate-700/50 hover:border-sky-500/50"
                            >
                                <i className="fas fa-times text-lg"></i>
                            </button>

                                    <i className="fas fa-radar text-2xl animate-pulse"></i>
                                </div>
                                <div>
                                    <h3 className="text-xl font-black text-slate-100 tracking-wide uppercase font-mono">
                                        Hazard <span className="text-sky-400">Analysis</span>
                                    </h3>
                                    <p className="text-xs text-slate-400 font-mono tracking-widest uppercase">ID: <span className="text-amber-400 font-bold">{detailModalItem.id}</span></p>
                                </div>
                            </div>
                            
                            <div className="space-y-5">
                                {/* Top Stats Row */}
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="bg-navy-900/60 border border-slate-700/50 p-4 rounded-xl flex flex-col items-center justify-center relative overflow-hidden group">
                                         <div className="absolute inset-0 bg-gradient-to-b from-transparent to-sky-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                        <i className="fas fa-calendar-alt text-slate-400 text-lg mb-2 group-hover:text-sky-400 transition-colors"></i>
                                        <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">Tanggal Kejadian</p>
                                        <p className="font-mono text-xs font-bold text-slate-200">
                                            {detailModalItem.dateObj ? detailModalItem.dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '-'}
                                        </p>
                                    </div>
                                    <div className="bg-navy-900/60 border border-slate-700/50 p-4 rounded-xl flex flex-col items-center justify-center relative overflow-hidden group">
                                         <div className="absolute inset-0 bg-gradient-to-b from-transparent to-rose-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                        <i className={`fas fa-triangle-exclamation text-lg mb-2 transition-colors ${
                                            detailModalItem.risk === 'Tinggi' ? 'text-rose-500 group-hover:text-rose-400' :
                                            detailModalItem.risk === 'Sedang' ? 'text-amber-500 group-hover:text-amber-400' :
                                            'text-emerald-500 group-hover:text-emerald-400'
                                        }`}></i>
                                        <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">Risk Level</p>
                                        <span className={`px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider ${
                                            detailModalItem.risk === 'Tinggi' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40 shadow-[0_0_10px_rgba(244,63,94,0.3)]' :
                                            detailModalItem.risk === 'Sedang' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40 shadow-[0_0_10px_rgba(251,191,36,0.3)]' :
                                            'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 shadow-[0_0_10px_rgba(52,211,153,0.3)]'
                                        }`}>
                                            {detailModalItem.risk}
                                        </span>
                                    </div>
                                    <div className="bg-navy-900/60 border border-slate-700/50 p-4 rounded-xl flex flex-col items-center justify-center relative overflow-hidden group">
                                         <div className="absolute inset-0 bg-gradient-to-b from-transparent to-emerald-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                        <i className={`fas text-lg mb-2 transition-colors ${
                                            detailModalItem.status === 'SELESAI' ? 'fa-check-circle text-emerald-500 group-hover:text-emerald-400' : 'fa-spinner fa-spin-pulse text-amber-500 group-hover:text-amber-400'
                                        }`}></i>
                                        <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">Status</p>
                                        <span className={`px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider ${
                                            detailModalItem.status === 'SELESAI' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 shadow-[0_0_10px_rgba(52,211,153,0.3)]' : 'bg-amber-500/20 text-amber-400 border border-amber-500/40 shadow-[0_0_10px_rgba(251,191,36,0.3)]'
                                        }`}>
                                            {detailModalItem.status}
                                        </span>
                                    </div>
                                </div>

                                {/* Main Detail Sections */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div className="space-y-4">
                                        <div className="bg-navy-900/40 border-l-2 border-l-sky-500 p-3 rounded-r-xl">
                                            <p className="text-[10px] text-sky-400/80 uppercase font-bold tracking-wider mb-1 flex items-center gap-1.5"><i className="fas fa-location-crosshairs text-[10px]"></i> Lokasi Bandara</p>
                                            <p className="font-semibold text-slate-100 text-sm">{detailModalItem.airport}</p>
                                        </div>
                                        <div className="bg-navy-900/40 border-l-2 border-l-amber-500 p-3 rounded-r-xl">
                                            <p className="text-[10px] text-amber-400/80 uppercase font-bold tracking-wider mb-1 flex items-center gap-1.5"><i className="fas fa-layer-group text-[10px]"></i> Kategori Hazard</p>
                                            <p className="font-semibold text-amber-300 text-sm">{detailModalItem.category}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-navy-900/40 border-l-2 border-l-rose-500 p-3 rounded-r-xl h-full flex flex-col">
                                         <p className="text-[10px] text-rose-400/80 uppercase font-bold tracking-wider mb-1 flex items-center gap-1.5"><i className="fas fa-map-pin text-[10px]"></i> Titik Spesifik Area</p>
                                         <p className="font-semibold text-slate-100 text-sm flex-1">{detailModalItem.location}</p>
                                    </div>
                                </div>

                                {/* Description Box */}
                                <div className="relative">
                                    <div className="absolute -inset-1 bg-gradient-to-r from-sky-500/20 to-emerald-500/20 rounded-xl blur-sm opacity-50"></div>
                                    <div className="relative bg-navy-950/80 border border-slate-700/60 rounded-xl p-5">
                                        <p className="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-3 flex items-center gap-2 border-b border-slate-800 pb-2">
                                            <i className="fas fa-align-left text-sky-400"></i> Uraian Detail Temuan
                                        </p>
                                        <p className="text-slate-200 text-sm leading-relaxed font-medium">
                                            {detailModalItem.desc}
                                        </p>
                                    </div>
                                </div>
                                
                                {/* Bottom Action Row */}
                                <div className="flex justify-end pt-2 border-t border-slate-700/60">
                                    <button 
                                        onClick={() => setDetailModalItem(null)} 
                                        className="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-lg transition-colors border border-slate-600 hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500/50 uppercase tracking-wider"
                                    >
                                        Tutup Panel
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* Airport Detail Modal */}
                {modalConfig.isOpen && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                        <div className="bg-navy-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[85vh] flex flex-col">
                            <button 
                                onClick={() => setModalConfig({ isOpen: false, airport: null, type: null, data: [] })} 
                                className="absolute top-4 right-4 text-slate-400 hover:text-slate-200"
                            >
                                <i className="fas fa-times text-lg"></i>
                            </button>
                            <h3 className="text-lg font-bold text-slate-100 flex items-center gap-2 mb-1">
                                <i className="fas fa-building text-sky-400"></i> Laporan: {modalConfig.airport}
                            </h3>
                            <p className="text-xs text-slate-400 mb-4">
                                {modalConfig.type === 'selesai' ? 'Daftar temuan status Selesai' : modalConfig.type === 'proses' ? 'Daftar temuan status Dalam Proses' : 'Semua rekapitulasi temuan'}
                            </p>

                            <div className="overflow-y-auto flex-1 border border-slate-700/60 rounded-xl">
                                <table className="w-full text-left text-xs text-slate-200">
                                    <thead className="bg-slate-900 text-slate-400 sticky top-0 uppercase font-semibold">
                                        <tr>
                                            <th className="p-2.5">ID / Tanggal</th>
                                            <th className="p-2.5">Kategori</th>
                                            <th className="p-2.5">Uraian</th>
                                            <th className="p-2.5 text-center">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {modalConfig.data.map((item) => (
                                            <tr key={item.id} className="hover:bg-slate-800/50">
                                                <td className="p-2.5 font-mono text-slate-300">{item.id}</td>
                                                <td className="p-2.5 text-amber-400 font-semibold">{item.category}</td>
                                                <td className="p-2.5 max-w-xs truncate">{item.desc}</td>
                                                <td className="p-2.5 text-center">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                                        item.status === 'SELESAI' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                                    }`}>
                                                        {item.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                )}

            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
