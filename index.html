<script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { 
        BarChart, Bar, LineChart, Line, AreaChart, Area, PieChart, Pie, Cell, 
        XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend, LabelList 
    } = window.Recharts;

    const DEFAULT_SAMPLE_CSV = `Event Date,Airport,Category,Description,Status,Lokasi Detail,Risk Rating
05/01/2026,Bandara Soekarno-Hatta (CGK),FOD,Ditemukan baut lepas dan kawat kassa serpihan di taxiway,SELESAI,Taxiway Echo 3,Tinggi

29/04/2026,Bandara Supadio (PNK),FOD,Kawat staples bekas kargo tercecer di apron,SELESAI,Apron Kargo,Tinggi
03/05/2026,Bandara Soekarno-Hatta (CGK),Bird Strike,Burung layang-layang terbang melintas rendah di threshold,SELESAI,Runway 07R,Tinggi
08/05/2026,Bandara Juanda (SUB),Sanitasi,Saluran air cuci tangan bocor di lavatory,SELESAI,Toilet Area Publik,Rendah
15/05/2026,Bandara Ngurah Rai (DPS),FOD,Kertas pembungkus mampet di kisi-kisi mesin gse,PROSES,Service Road Gate 2,Sedang
20/05/2026,Bandara Sultan Hasanuddin (UPG),Airfield Lighting,Indikator CCR sirkit 2 mengalami fluktuasi voltase,PROSES,Gedung Kelistrikan,Tinggi
26/05/2026,Bandara Pattimura (AMQ),Drainase Sisi Udara,Endapan lumpur memenuhi parit pembuangan,SELESAI,Drainase Utama,Sedang`;

    const classifyHazard = (desc) => {
        if (!desc) return "Hazard Operasional lainnya";
        const text = desc.toString().toLowerCase();
        
        if (/(sanitasi|air kotor|wc mampet|pesing|kotoran|saluran mampet)/.test(text)) return "Sanitasi";
        if (/(drainase|parit|genangan|saluran air|banjir|gorong-gorong)/.test(text)) return "Drainase Sisi Udara";
        if (/(baut|kerikil|batu|kawat|plastik|benda asing|fod|serpihan)/.test(text)) return "FOD (Foreign Object Debris)";
        if (/(burung|bird|baza|kuntul|cangak)/.test(text)) return "Bird Strike";
        if (/(anjing|kucing|ular|monyet|babi|biawak|hewan liar|wildlife)/.test(text)) return "Wildlife Hazard";
        if (/(afl|papi|runway light|taxiway light|apron light|sirkit|lampu landasan|constant current regulator)/.test(text)) return "Airfield Lighting";
        if (/(kabel|konslet|listrik|panel|mcb|trafo|genset|stop kontak|saklar)/.test(text)) return "Kelistrikan Bangunan";
        if (/(atap|plafon|dinding|lantai|kaca|bocor|retak|struktur bangunan)/.test(text)) return "Struktur Bangunan";
        if (/(aspal|beton|pavement|lubang|taxiway retak|apron amblas)/.test(text)) return "Struktur Permukaan";
        if (/(marka|cat memudar|garis|tulisan terkelupas)/.test(text)) return "Marka Runway/Taxiway/Apron";
        if (/(gse|baggage cart|towing|aft|btt|loader)/.test(text)) return "Peralatan GSE";
        if (/(sop|kelelahan|human factor|kelalaian|tidak menggunakan apd|pelanggaran)/.test(text)) return "Human Factor";
        if (/(rumput|ilalang|gulma|vegetasi|pohon)/.test(text)) return "Rumput & Vegetasi Liar";

        return "Hazard Operasional lainnya";
    };

    const getCalculatedRisk = (category, desc) => {
        const text = (desc || "").toLowerCase();
        if (/(runway|papi|baut|konslet|trafo|pothole|amblas|burung)/.test(text) || 
            category === "Bird Strike" || category === "Airfield Lighting" || category === "FOD (Foreign Object Debris)") {
            return "Tinggi";
        }
        if (category === "Sanitasi" || category === "Rumput & Vegetasi Liar") {
            return "Rendah";
        }
        return "Sedang";
    };

    const App = () => {
        const [data, setData] = useState([]);
        const [loading, setLoading] = useState(true);
        const [fileName, setFileName] = useState("");
        const [currentTime, setCurrentTime] = useState(new Date());
        
        // Navigation & View Tabs
        const [activeTab, setActiveTab] = useState('overview'); // 'overview', 'risk', 'table'

        // Interactive Filters State
        const [searchTerm, setSearchTerm] = useState("");
        const [filterStart, setFilterStart] = useState("");
        const [filterEnd, setFilterEnd] = useState("");
        const [filterAirport, setFilterAirport] = useState("ALL");
        const [filterCategory, setFilterCategory] = useState("ALL");
        const [filterStatus, setFilterStatus] = useState("ALL");
        const [filterRisk, setFilterRisk] = useState("ALL");
        const [filterCompRate, setFilterCompRate] = useState("ALL");
        const [filterMonth, setFilterMonth] = useState("ALL");

        // Table Pagination State
        const [currentPage, setCurrentPage] = useState(1);
        const itemsPerPage = 10;

        // UI & Export State
        const [isDataLoaded, setIsDataLoaded] = useState(false);
        const [isExportingPDF, setIsExportingPDF] = useState(false);
        const [sidebarOpen, setSidebarOpen] = useState(true);

        // Sorting & Modal State
        const [sortConfig, setSortConfig] = useState({ key: 'total', direction: 'desc' });
        const [modalConfig, setModalConfig] = useState({ isOpen: false, airport: null, type: null, data: [] });
        const [detailModalItem, setDetailModalItem] = useState(null);

        const dashboardRef = useRef(null);

        useEffect(() => {
            const timer = setInterval(() => setCurrentTime(new Date()), 1000);
            return () => clearInterval(timer);
        }, []);

        const formattedDate = currentTime.toLocaleDateString('id-ID', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });

        const handleExportPDF = () => {
            if (!dashboardRef.current) return;
            
            setIsExportingPDF(true);
            document.body.classList.add('export-mode');

            setTimeout(() => {
                const element = dashboardRef.current;
                const opt = {
                    margin:       [6, 6, 6, 6],
                    filename:     `Hazard_Dashboard_${new Date().toISOString().slice(0,10)}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true, 
                        logging: false,
                        backgroundColor: '#020617',
                        windowWidth: 1080,
                        width: 1080,
                        scrollX: 0,
                        scrollY: 0
                    },
                    pagebreak:    { mode: ['css', 'legacy'] },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape', compress: true }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    setIsExportingPDF(false);
                    document.body.classList.remove('export-mode');
                }).catch(err => {
                    console.error("Error generating PDF:", err);
                    setIsExportingPDF(false);
                    document.body.classList.remove('export-mode');
                });
            }, 1000);
        };

        const handleExportCSV = () => {
            if (!filteredData.length) return;
            const exportRows = filteredData.map(d => ({
                "Tanggal": d.dateObj ? d.dateObj.toLocaleDateString('id-ID') : '',
                "Bandara": d.airport,
                "Kategori": d.category,
                "Uraian Hazard": d.desc,
                "Lokasi Detail": d.location,
                "Risk Rating": d.risk,
                "Status": d.status
            }));

            const csvString = Papa.unparse(exportRows);
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Hazard_Report_Export_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const parseCSV = (fileOrUrl) => {
            setLoading(true);
            Papa.parse(fileOrUrl, {
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    const rawData = results.data;
                    if (rawData.length === 0) {
                        setLoading(false);
                        return;
                    }

                    const headers = Object.keys(rawData[0]).map(h => h.trim().toLowerCase());
                    
                    const findCol = (keywords) => {
                        for(let k of keywords) {
                            const exact = headers.find(h => h === k);
                            if(exact) return Object.keys(rawData[0])[headers.indexOf(exact)];
                        }
                        for(let k of keywords) {
                            const partial = headers.find(h => h.includes(k));
                            if(partial) return Object.keys(rawData[0])[headers.indexOf(partial)];
                        }
                        return null;
                    };

                    const activeCols = {
                        date: findCol(['eventdate', 'event date', 'tanggal', 'date', 'waktu']) || Object.keys(rawData[0])[0],
                        airport: findCol(['airport', 'bandara', 'cabang', 'lokasi']) || Object.keys(rawData[0])[1],
                        category: findCol(['category', 'kategori']) || Object.keys(rawData[0])[2],
                        desc: findCol(['description', 'uraian', 'deskripsi', 'uraian kejadian']) || Object.keys(rawData[0])[2],
                        status: findCol(['status tindak lanjut', 'status', 'status temuan']) || Object.keys(rawData[0])[3],
                        locationDetails: findCol(['lokasi detail', 'detail lokasi', 'area', 'tempat', 'location', 'lokasi temuan']) || null,
                        risk: findCol(['risk rating', 'risk', 'tingkat risiko', 'risiko']) || null
                    };

                    const processedData = [];
                    let idCounter = 101;

                    rawData.forEach((row) => {
                        const getVal = (colKey) => {
                            const key = activeCols[colKey];
                            return key && row[key] ? row[key].toString().trim() : "";
                        };

                        const airportRaw = getVal('airport');
                        let apClean = airportRaw ? airportRaw.trim() : "";
                        const apUpper = apClean.toUpperCase();

                        if (!apClean || apClean === "-" || apUpper === "UNSPECIFIED" || 
                            apUpper.includes("HANG NADIM") || apUpper.includes("KUALANAMU") || apUpper.includes("KUALA NAMU")) {
                            return;
                        }

                        const dateRaw = getVal('date');
                        const descRaw = getVal('desc');
                        const statusRaw = getVal('status');
                        const rawLoc = activeCols['locationDetails'] ? getVal('locationDetails') : "";
                        const rawRisk = activeCols['risk'] ? getVal('risk') : "";
                        
                        let locationClean = rawLoc.trim();
                        if (!locationClean || locationClean === "-") locationClean = "Area Tidak Spesifik";

                        let dateObj;
                        const parts = (dateRaw || "").trim().split(/[-/]/);
                        if (parts.length === 3) {
                            if (parts[2].length === 4) dateObj = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                            else if (parts[0].length === 4) dateObj = new Date(`${parts[0]}-${parts[1]}-${parts[2]}`);
                            else dateObj = new Date(dateRaw);
                        } else {
                            dateObj = new Date(dateRaw);
                        }

                        if (isNaN(dateObj.getTime())) dateObj = new Date(2026, 0, 1);
                        
                        const month = dateObj.toLocaleString('id-ID', { month: 'short', year: 'numeric' });
                        const monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;

                        let statusClean = 'PROSES';
                        const s = (statusRaw || "").toUpperCase();
                        if (s.includes('CLOSE') || s.includes('SELESAI') || s.includes('CLASSIFIED')) {
                            statusClean = 'SELESAI';
                        }

                        const categoryClean = classifyHazard(descRaw);
                        const riskLevel = rawRisk || getCalculatedRisk(categoryClean, descRaw);

                        processedData.push({
                            id: `HZD-${idCounter++}`,
                            raw: row,
                            dateObj,
                            month,
                            monthKey,
                            airport: apClean,
                            category: categoryClean,
                            status: statusClean,
                            desc: descRaw,
                            location: locationClean,
                            risk: riskLevel
                        });
                    });
                    
                    setData(processedData);
                    setIsDataLoaded(true);
                    setLoading(false);
                },
                error: (err) => {
                    console.error("Error parsing CSV:", err);
                    setLoading(false);
                }
            });
        };

        const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                setFileName(file.name);
                parseCSV(file);
            }
        };

        useEffect(() => {
            setFileName("Default_Sample_Hazard_2026.csv");
            parseCSV(DEFAULT_SAMPLE_CSV);
        }, []);

        const filteredData = useMemo(() => {
            let temp = [...data];

            if (searchTerm.trim()) {
                const query = searchTerm.toLowerCase();
                temp = temp.filter(d => 
                    d.desc.toLowerCase().includes(query) ||
                    d.airport.toLowerCase().includes(query) ||
                    d.category.toLowerCase().includes(query) ||
                    d.location.toLowerCase().includes(query)
                );
            }

            if (filterStart) {
                const start = new Date(filterStart);
                temp = temp.filter(d => d.dateObj >= start);
            }
            if (filterEnd) {
                const end = new Date(filterEnd);
                temp = temp.filter(d => d.dateObj <= end);
            }
            if (filterMonth !== "ALL") {
                temp = temp.filter(d => d.month === filterMonth);
            }
            if (filterAirport !== "ALL") {
                temp = temp.filter(d => d.airport === filterAirport);
            }
            if (filterCategory !== "ALL") {
                temp = temp.filter(d => d.category === filterCategory);
            }
            if (filterStatus !== "ALL") {
                temp = temp.filter(d => d.status === filterStatus);
            }
            if (filterRisk !== "ALL") {
                temp = temp.filter(d => d.risk === filterRisk);
            }

            return temp;
        }, [data, searchTerm, filterStart, filterEnd, filterAirport, filterCategory, filterStatus, filterRisk, filterMonth]);

        const stats = useMemo(() => {
            const total = filteredData.length;
            const selesai = filteredData.filter(d => d.status === 'SELESAI').length;
            const proses = total - selesai;
            const compRate = total > 0 ? ((selesai / total) * 100).toFixed(1) : 0;
            const highRiskCount = filteredData.filter(d => d.risk === 'Tinggi').length;
            return { total, selesai, proses, compRate, highRiskCount };
        }, [filteredData]);

        const topHazards = useMemo(() => {
            const counts = {};
            const totalItems = filteredData.length;
            
            filteredData.forEach(d => counts[d.category] = (counts[d.category] || 0) + 1);
            
            return Object.entries(counts)
                .map(([name, count]) => ({
                    name, 
                    shortName: name.length > 22 ? name.substring(0, 19) + '...' : name,
                    count, 
                    percentage: totalItems > 0 ? ((count / totalItems) * 100).toFixed(1) : 0,
                    displayLabel: `${count} (${totalItems > 0 ? ((count / totalItems) * 100).toFixed(1) : 0}%)`
                }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 8);
        }, [filteredData]);

        const topLocations = useMemo(() => {
            const counts = {};
            const totalItems = filteredData.length;
            
            filteredData.forEach(d => {
                let loc = d.location || "Area Tidak Spesifik";
                counts[loc] = (counts[loc] || 0) + 1;
            });
            return Object.entries(counts)
                .map(([name, count]) => ({
                    name, 
                    shortName: name.length > 20 ? name.substring(0, 17) + '...' : name,
                    count,
                    percentage: totalItems > 0 ? ((count / totalItems) * 100).toFixed(1) : 0,
                    displayLabel: `${count} (${totalItems > 0 ? ((count / totalItems) * 100).toFixed(1) : 0}%)`
                }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 8);
        }, [filteredData]);

        const trendData = useMemo(() => {
            const counts = {};
            filteredData.forEach(d => {
                if (!counts[d.month]) {
                    counts[d.month] = { name: d.month, count: 0, sortKey: d.monthKey, selesai: 0, proses: 0 };
                }
                counts[d.month].count += 1;
                if (d.status === 'SELESAI') counts[d.month].selesai += 1;
                else counts[d.month].proses += 1;
            });
            return Object.values(counts).sort((a, b) => a.sortKey.localeCompare(b.sortKey));
        }, [filteredData]);

        const statusPieData = useMemo(() => [
            { name: 'Selesai', value: stats.selesai, color: '#34d399' },
            { name: 'Dalam Proses', value: stats.proses, color: '#fbbf24' }
        ], [stats]);

        const dailyTrendData = useMemo(() => {
            const counts = {};
            filteredData.forEach(d => {
                if (!d.dateObj) return;

                        name: displayDate, 
                        dateStr: dateKey,
                        count: 0, 
                        selesai: 0, 
                        proses: 0,
                        dateObj: d.dateObj

                counts[dateKey].count += 1;
                if (d.status === 'SELESAI') counts[dateKey].selesai += 1;
                else counts[dateKey].proses += 1;

            return Object.values(counts).sort((a, b) => a.dateObj - b.dateObj);

                map[d.airport].total += 1;
                if(d.status === 'SELESAI') map[d.airport].selesai += 1;
            });
            
            let result = Object.values(map).map(a => {
                const rate = a.total > 0 ? (a.selesai / a.total) * 100 : 0;
                return { ...a, proses: a.total - a.selesai, compRate: rate, compRateStr: rate.toFixed(1) + '%' };
            });

            if (filterCompRate === "<50") result = result.filter(a => a.compRate < 50);
            if (filterCompRate === "50-80") result = result.filter(a => a.compRate >= 50 && a.compRate <= 80);
            if (filterCompRate === ">80") result = result.filter(a => a.compRate > 80);

                } else {
                    return sortConfig.direction === 'asc' ? a[sortConfig.key] - b[sortConfig.key] : b[sortConfig.key] - a[sortConfig.key];
                }

            return result;

                                </div>
                                <div className="w-full h-64">
                                    {dailyTrendData.length > 0 ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={dailyTrendData} margin={{ top: 20, right: 20, left: 0, bottom: 0 }}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                                                <XAxis dataKey="name" stroke="#64748b" tick={{fill: '#94a3b8', fontSize: 11}} />
                                                <YAxis stroke="#64748b" tick={{fill: '#94a3b8', fontSize: 11}} allowDecimals={false} />
                                                <Tooltip content={<CustomTooltip />} />
                                                <Legend wrapperStyle={{ fontSize: '11px', paddingTop: '10px' }} />
                                                <Line type="monotone" dataKey="count" name="Total Hazard" stroke="#38bdf8" strokeWidth={2.5} dot={{ r: 4, fill: '#38bdf8' }} activeDot={{ r: 6 }}>
                                                    <LabelList dataKey="count" position="top" fill="#38bdf8" fontSize={10} fontWeight="bold" offset={6} />
                                                </Line>
                                                <Line type="monotone" dataKey="selesai" name="Selesai" stroke="#34d399" strokeWidth={1.5} strokeDasharray="3 3" dot={false} />
                                                <Line type="monotone" dataKey="proses" name="Proses" stroke="#fbbf24" strokeWidth={1.5} strokeDasharray="3 3" dot={false} />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    ) : (
                                        <div className="flex items-center justify-center h-full text-slate-500 text-xs">
                                            Tidak ada data laporan harian untuk filter ini
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Top Categories & Top Locations Grid */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div className="glass-panel p-5 rounded-2xl border border-slate-700/60 shadow-xl pdf-page-block">
                                    <h3 className="text-sm font-bold text-slate-100 mb-4 flex items-center gap-2">
                                        <i className="fas fa-list-ol text-amber-400"></i> Top Kategori Hazard
                                    </h3>
                                    <div className="w-full h-72">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={topHazards} layout="vertical" margin={{ top: 5, right: 55, left: 110, bottom: 5 }}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" horizontal={false} />
                                                <XAxis type="number" stroke="#64748b" tick={{fill: '#94a3b8', fontSize: 11}} />
                                                <YAxis dataKey="shortName" type="category" stroke="#64748b" width={110} tick={{fill: '#f1f5f9', fontSize: 10}} />
                                                <Tooltip content={<CustomTooltip />} />
                                                <Bar dataKey="count" fill="#fbbf24" radius={[0, 4, 4, 0]} onClick={(entry) => setFilterCategory(entry.name)}>
                                                    {topHazards.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={['#fde68a', '#fcd34d', '#fbbf24', '#f59e0b', '#ea580c'][index % 5]} className="cursor-pointer hover:opacity-80" />
                                                    ))}
                                                    <LabelList dataKey="displayLabel" position="right" fill="#fbbf24" fontSize={10} fontWeight="bold" offset={6} />
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="glass-panel p-5 rounded-2xl border border-slate-700/60 shadow-xl pdf-page-block">
                                    <h3 className="text-sm font-bold text-slate-100 mb-4 flex items-center gap-2">
                                        <i className="fas fa-map-pin text-rose-400"></i> Top Area Lokasi Temuan
                                    </h3>
                                    <div className="w-full h-72">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={topLocations} layout="vertical" margin={{ top: 5, right: 65, left: 100, bottom: 5 }}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" horizontal={false} />
                                                <XAxis type="number" stroke="#64748b" tick={{fill: '#94a3b8', fontSize: 11}} />
                                                <YAxis dataKey="shortName" type="category" stroke="#64748b" width={100} tick={{fill: '#f1f5f9', fontSize: 10}} />
                                                <Tooltip content={<CustomTooltip />} />
                                                <Bar dataKey="count" fill="#fb7185" radius={[0, 4, 4, 0]}>
                                                    {topLocations.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={['#fda4af', '#fb7185', '#f43f5e', '#e11d48', '#be123c'][index % 5]} />
                                                    ))}
                                                    <LabelList dataKey="displayLabel" position="right" fill="#fb7185" fontSize={10} fontWeight="bold" offset={6} />
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </div>

                            <div className="glass-panel p-5 rounded-2xl border border-slate-700/60 shadow-xl pdf-page-block">
                                <h3 className="text-base font-bold text-slate-100 mb-4 flex items-center justify-between">
                                    <span className="flex items-center gap-2"><i className="fas fa-building text-aviation-blue"></i> Performa Bandara & Rekapitulasi</span>
                                    <span className="text-xs text-slate-400 font-normal">Klik nama angka untuk lihat detail</span>
                                </h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs text-slate-200">
                                        <thead className="bg-slate-800/90 text-slate-400 uppercase font-semibold">
                                            <tr>
                                                <th className="p-3 cursor-pointer" onClick={() => handleSort('name')}>Bandara <i className="fas fa-sort ml-1"></i></th>
                                                <th className="p-3 text-center cursor-pointer" onClick={() => handleSort('total')}>Total <i className="fas fa-sort ml-1"></i></th>
                                                <th className="p-3 text-center text-emerald-400 cursor-pointer" onClick={() => handleSort('selesai')}>Selesai <i className="fas fa-sort ml-1"></i></th>
                                                <th className="p-3 text-center text-amber-400 cursor-pointer" onClick={() => handleSort('proses')}>Proses <i className="fas fa-sort ml-1"></i></th>
                                                <th className="p-3 text-center cursor-pointer" onClick={() => handleSort('compRate')}>Completion <i className="fas fa-sort ml-1"></i></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800">
                                            {sortedAirportData.map((row, idx) => (
                                                <tr key={idx} className="hover:bg-slate-800/50 transition-colors">
                                                    <td className="p-3 font-medium text-slate-100">{row.name}</td>
                                                    <td className="p-3 text-center">
                                                        <button onClick={() => handleOpenAirportModal(row.name, 'all')} className="text-sky-400 font-bold hover:underline">{row.total}</button>
                                                    </td>
                                                    <td className="p-3 text-center">
                                                        <button onClick={() => handleOpenAirportModal(row.name, 'selesai')} className="text-emerald-400 font-bold hover:underline">{row.selesai}</button>
                                                    </td>
                                                    <td className="p-3 text-center">
                                                        <button onClick={() => handleOpenAirportModal(row.name, 'proses')} className="text-amber-400 font-bold hover:underline">{row.proses}</button>
                                                    </td>
                                                    <td className="p-3">
                                                        <div className="flex items-center gap-2">
                                                            <div className="w-full bg-slate-700 rounded-full h-1.5">
                                                                <div className={`h-1.5 rounded-full ${row.compRate >= 80 ? 'bg-emerald-400' : row.compRate >= 50 ? 'bg-amber-400' : 'bg-rose-400'}`} style={{ width: `${row.compRate}%` }}></div>
                                                            </div>
                                                            <span className="font-mono text-[11px] w-10 text-right">{row.compRateStr}</span>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB CONTENT 2: RISK MATRIX */}
                    {activeTab === 'risk' && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="glass-panel p-5 rounded-2xl border border-slate-700/60 shadow-xl col-span-1">
                                    <h3 className="text-sm font-bold text-slate-100 mb-4 flex items-center gap-2">
                                        <i className="fas fa-triangle-exclamation text-rose-400"></i> Proporsi Profil Risiko
                                    </h3>
                                    <div className="w-full h-64">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie 
                                                    data={riskPieData} 
                                                    cx="50%" 
                                                    cy="50%" 
                                                    outerRadius={70} 
                                                    dataKey="value"
                                                    label={renderCustomPieLabel}
                                                    labelLine={false}
                                                >
                                                    {riskPieData.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={entry.color} />
                                                    ))}
                                                </Pie>
                                                <Tooltip content={<CustomTooltip />} />
                                                <Legend wrapperStyle={{ fontSize: '11px' }} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="glass-panel p-5 rounded-2xl border border-slate-700/60 shadow-xl md:col-span-2 flex flex-col justify-between">
                                    <div>
                                        <h3 className="text-sm font-bold text-slate-100 mb-2 flex items-center gap-2">
                                            <i className="fas fa-shield-cat text-amber-400"></i> Klasifikasi Tingkat Bahaya Risiko
                                        </h3>
                                        <p className="text-xs text-slate-400 mb-4">
                                            Matriks penilaian risiko keselamatan penerbangan berdasarkan dampak operasional terhadap keamanan airside.
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div className="bg-rose-950/40 border border-rose-500/30 p-3 rounded-xl">
                                            <div className="flex items-center gap-2 text-rose-400 font-bold text-xs mb-1">
                                                <span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Tinggi
                                            </div>
                                            <p className="text-[11px] text-slate-300">Resiko tinggi terhadap keselamatan runway, AFL, birdstrike, FOD tajam. Butuh tindakan instan.</p>
                                        </div>
                                        <div className="bg-amber-950/40 border border-amber-500/30 p-3 rounded-xl">
                                            <div className="flex items-center gap-2 text-amber-400 font-bold text-xs mb-1">
                                                <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Sedang
                                            </div>
                                            <p className="text-[11px] text-slate-300">Gangguan minor pada apron, taxiway, drainase. Membutuhkan tindak lanjut berkala.</p>
                                        </div>
                                        <div className="bg-emerald-950/40 border border-emerald-500/30 p-3 rounded-xl">
                                            <div className="flex items-center gap-2 text-emerald-400 font-bold text-xs mb-1">
                                                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Rendah
                                            </div>
                                            <p className="text-[11px] text-slate-300">Sanitasi, kebersihan umum, fasilitas minor. Risiko minimal terhadap keselamatan penerbangan.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB CONTENT 3: TABLE VIEW */}
                    {activeTab === 'table' && (
                        <div className="glass-panel p-5 rounded-2xl border border-slate-700/60 shadow-xl space-y-4">
                            <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                                <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">
                                    <i className="fas fa-table text-aviation-blue"></i> Detail Laporan Hazard ({filteredData.length})
                                </h3>
                                <div className="text-xs text-slate-400">
                                    Menampilkan Halaman {currentPage} dari {totalPages}
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs text-slate-200">
                                    <thead className="bg-slate-800/90 text-slate-400 uppercase font-semibold">
                                        <tr>
                                            <th className="p-3">ID / Tanggal</th>
                                            <th className="p-3">Bandara</th>
                                            <th className="p-3">Kategori</th>
                                            <th className="p-3">Deskripsi Hazard</th>
                                            <th className="p-3">Lokasi</th>
                                            <th className="p-3 text-center">Risiko</th>
                                            <th className="p-3 text-center">Status</th>
                                            <th className="p-3 text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {paginatedData.map((item) => (
                                            <tr key={item.id} className="hover:bg-slate-800/50 transition-colors">
                                                <td className="p-3 whitespace-nowrap">
                                                    <span className="font-mono text-slate-400 block">{item.id}</span>
                                                    <span className="font-semibold text-slate-200">{item.dateObj ? item.dateObj.toLocaleDateString('id-ID') : '-'}</span>
                                                </td>
                                                <td className="p-3 font-medium text-slate-100">{item.airport}</td>
                                                <td className="p-3 text-sky-400 font-medium">{item.category}</td>
                                                <td className="p-3 max-w-xs truncate" title={item.desc}>{item.desc}</td>
                                                <td className="p-3 text-slate-300">{item.location}</td>
                                                <td className="p-3 text-center">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                                        item.risk === 'Tinggi' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                                                        item.risk === 'Sedang' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                                        'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                                                    }`}>
                                                        {item.risk}
                                                    </span>
                                                </td>
                                                <td className="p-3 text-center">
                                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                                        item.status === 'SELESAI' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                                                        'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                                    }`}>
                                                        {item.status}
                                                    </span>
                                                </td>
                                                <td className="p-3 text-center">
                                                    <button 
                                                        onClick={() => setDetailModalItem(item)} 
                                                        className="p-1.5 bg-slate-800 hover:bg-slate-700 text-sky-400 rounded-lg transition-colors"
                                                        title="Lihat Detail Laporan"
                                                    >
                                                        <i className="fas fa-eye"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            {/* Pagination Buttons */}
                            <div className="flex items-center justify-between pt-3 border-t border-slate-800">
                                <button 
                                    onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                                    disabled={currentPage === 1}
                                    className="px-3 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold"
                                >
                                    <i className="fas fa-chevron-left mr-1"></i> Sebelum
                                </button>
                                <span className="text-xs text-slate-400">
                                    Halaman {currentPage} dari {totalPages}
                                </span>
                                <button 
                                    onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                                    disabled={currentPage === totalPages}
                                    className="px-3 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold"
                                >
                                    Sesudah <i className="fas fa-chevron-right ml-1"></i>
                                </button>
                            </div>
                        </div>
                    )}

                </main>

                {/* MODAL 1: Detail Item Hazard */}
                {detailModalItem && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                        <div className="bg-navy-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative animate-in fade-in">
                            <button 
                                onClick={() => setDetailModalItem(null)} 
                                className="absolute top-4 right-4 text-slate-400 hover:text-slate-200"
                            >
                                <i className="fas fa-times text-lg"></i>
                            </button>
                            <h3 className="text-lg font-bold text-slate-100 flex items-center gap-2 mb-4">
                                <i className="fas fa-file-circle-exclamation text-aviation-blue"></i> Detail Hazard Report
                            </h3>
                            <div className="space-y-3 text-xs text-slate-300">
                                <div className="grid grid-cols-2 gap-2 bg-navy-900/60 p-3 rounded-xl border border-slate-800">
                                    <div>
                                        <p className="text-slate-400 text-[10px] uppercase font-bold">ID Laporan</p>
                                        <p className="font-mono text-sky-400 font-bold">{detailModalItem.id}</p>
                                    </div>
                                    <div>
                                        <p className="text-slate-400 text-[10px] uppercase font-bold">Tanggal</p>
                                        <p className="font-semibold">{detailModalItem.dateObj ? detailModalItem.dateObj.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : '-'}</p>
                                    </div>
                                </div>
                                <div>
                                    <p className="text-slate-400 text-[10px] uppercase font-bold mb-0.5">Bandara</p>
                                    <p className="font-semibold text-slate-100">{detailModalItem.airport}</p>
                                </div>
                                <div>
                                    <p className="text-slate-400 text-[10px] uppercase font-bold mb-0.5">Kategori & Lokasi</p>
                                    <p className="font-semibold text-amber-400">{detailModalItem.category} - <span className="text-slate-200">{detailModalItem.location}</span></p>
                                </div>
                                <div>
                                    <p className="text-slate-400 text-[10px] uppercase font-bold mb-0.5">Uraian Temuan Hazard</p>
                                    <div className="p-3 bg-navy-900 rounded-xl border border-slate-800 text-slate-200 leading-relaxed">
                                        {detailModalItem.desc}
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-2 pt-2">
                                    <div>
                                        <p className="text-slate-400 text-[10px] uppercase font-bold mb-1">Status Tindak Lanjut</p>
                                        <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                            detailModalItem.status === 'SELESAI' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                        }`}>
                                            {detailModalItem.status}
                                        </span>
                                    </div>
                                    <div>
                                        <p className="text-slate-400 text-[10px] uppercase font-bold mb-1">Tingkat Risiko</p>
                                        <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                            detailModalItem.risk === 'Tinggi' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                                            detailModalItem.risk === 'Sedang' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                            'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                                        }`}>
                                            {detailModalItem.risk}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL 2: Modal Summary Bandara */}
                {modalConfig.isOpen && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                        <div className="bg-navy-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[85vh] flex flex-col">
                            <button 
                                onClick={() => setModalConfig({ isOpen: false, airport: null, type: null, data: [] })} 
                                className="absolute top-4 right-4 text-slate-400 hover:text-slate-200"
                            >
                                <i className="fas fa-times text-lg"></i>
                            </button>
                            <h3 className="text-lg font-bold text-slate-100 flex items-center gap-2 mb-1">
                                <i className="fas fa-building text-sky-400"></i> Laporan: {modalConfig.airport}
                            </h3>
                            <p className="text-xs text-slate-400 mb-4">
                                {modalConfig.type === 'selesai' ? 'Daftar temuan status Selesai' : modalConfig.type === 'proses' ? 'Daftar temuan status Dalam Proses' : 'Semua rekapitulasi temuan'}
                            </p>

                            <div className="overflow-y-auto flex-1 border border-slate-700/60 rounded-xl">
                                <table className="w-full text-left text-xs text-slate-200">
                                    <thead className="bg-slate-900 text-slate-400 sticky top-0 uppercase font-semibold">
                                        <tr>
                                            <th className="p-2.5">ID / Tanggal</th>
                                            <th className="p-2.5">Kategori</th>
                                            <th className="p-2.5">Uraian</th>
                                            <th className="p-2.5 text-center">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {modalConfig.data.map((item) => (
                                            <tr key={item.id} className="hover:bg-slate-800/50">
                                                <td className="p-2.5 font-mono text-slate-300">{item.id}</td>
                                                <td className="p-2.5 text-amber-400 font-semibold">{item.category}</td>
                                                <td className="p-2.5 max-w-xs truncate">{item.desc}</td>
                                                <td className="p-2.5 text-center">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                                        item.status === 'SELESAI' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                                    }`}>
                                                        {item.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                )}

            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
